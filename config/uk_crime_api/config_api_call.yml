# API CONFIG
api_url: "https://data.police.uk/api/crimes-street/all-crime"
months: 
  - "2025-01"
  #- "2025-02"
  #- "2025-03"
  #- "2025-04"
  #- "2025-05"
  #- "2025-06"
  #- "2025-07"
  #- "2025-08"
  #- "2025-09"
  #- "2025-10"
  #- "2025-11"
  #- "2025-12"

areas:
  #- config/uk_crime_api/areas/hartlepool.yml
  #- "config/uk_crime_api/areas/_debug.yml"
  - "config/uk_crime_api/areas/london.yml"
  - "config/uk_crime_api/areas/birmingham.yml"
  - "config/uk_crime_api/areas/belfast.yml"
  - "config/uk_crime_api/areas/coventry.yml"
  

initial_poly_split: 4

# Rate limiting and retries
max_retries: 5
wait_on_success: 1
wait_on_error: 5
timeout: 40
wait_on_429: 10


# Output 
output_dir_raw: "data/raw/uk_crime_api_call2"
output_dir_processed: "data/processed/uk_crime"

