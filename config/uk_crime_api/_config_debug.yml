# API CONFIG
api_url: "https://data.police.uk/api/crimes-street/all-crime"
months: 
  - "2026-01"

areas:
  - "config/uk_crime_api/areas/_debug.yml"

initial_poly_split: 1

# Rate limiting and retries
max_retries: 5
wait_on_success: 2
wait_on_error: 5
timeout: 30


# Output 
output_dir_raw: "data/raw/debug"
output_dir_processed: "data/processed/debug"

