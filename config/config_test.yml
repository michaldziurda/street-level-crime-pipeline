
# API CONFIG
api_url: "https://data.police.uk/api/crimes-street/all-crime"
month: "2026-01"

# Define the polygon you want data from 
# for testing purposes - only city of london
area_of_interest:
  # List of vertices in [longitude, latitude] (x, y) order for EPSG:4326
  coordinates:
    - [-0.08, 51.507]
    - [-0.109, 51.51]
    - [-0.111, 51.51]
    - [-0.112, 51.515]
    - [-0.105, 51.519]
    - [-0.085, 51.52]
    - [-0.079, 51.522]
    - [-0.08, 51.507]
    # Optionally, repeat the first point to close the loop explicitly:
    # - [-0.51, 51.29]

# Rate limiting and retries
max_retries: 5
wait_on_success: 1
timeout: 30

# Output 
output_dir_raw: "data/raw/uk_crime_api_calls"
output_dir_processed: "data/processed/uk_crime_processed"

# Database
dbname: 
user: os.getenv("DB_USER"),
password: os.getenv("DB_PASSWORD"),
host: os.getenv("DB_HOST"),
port: os.getenv("DB_PORT")

